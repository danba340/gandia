<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gandia Day Trip Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        --bg-1: #fff3dc;
        --bg-2: #ffe0b8;
        --panel: #fffaf2;
        --ink: #1f2a2f;
        --muted: #5e6b71;
        --line: #e2d6c4;
        --accent: #127a76;
        --accent-2: #ea6f2d;
        --ok: #1d8f52;
        --warn: #a84e2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Sora", "Segoe UI", sans-serif;
        background: radial-gradient(circle at 10% 15%, #fff9ee 0%, transparent 40%),
          radial-gradient(circle at 85% 8%, #ffd8ab 0%, transparent 36%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
      }

      .shell {
        width: min(1280px, calc(100vw - 2rem));
        margin: 1rem auto;
        border: 1px solid #decfb8;
        border-radius: 22px;
        overflow: hidden;
        backdrop-filter: blur(5px);
        box-shadow: 0 18px 40px rgba(120, 85, 42, 0.15);
        background: rgba(255, 253, 247, 0.92);
      }

      .topbar {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .title {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 700;
        letter-spacing: 0.2px;
        font-size: clamp(1.1rem, 1.2vw + 0.8rem, 1.7rem);
      }

      .subtitle {
        margin: 0.2rem 0 0;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .meta {
        color: var(--muted);
        font-size: 0.8rem;
        text-align: right;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 78vh;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        background: linear-gradient(180deg, #fff8ec 0%, #fff5e4 100%);
        overflow: auto;
      }

      .sidebar-header {
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 0.95rem 0.95rem 0.8rem;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 249, 236, 0.95);
        backdrop-filter: blur(3px);
      }

      .sidebar-header h2 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .trip-list {
        display: grid;
        gap: 0.6rem;
        padding: 0.85rem;
      }

      .trip-item {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fffefb;
        padding: 0.7rem;
        text-align: left;
        cursor: pointer;
        transition: 0.18s transform ease, 0.18s border-color ease, 0.18s background ease;
      }

      .trip-item:hover {
        transform: translateY(-1px);
        border-color: #c7b49d;
      }

      .trip-item.active {
        border-color: var(--accent);
        background: #f1fdfc;
      }

      .trip-item h3 {
        margin: 0;
        font-size: 0.92rem;
      }

      .trip-item .row {
        margin-top: 0.45rem;
        color: var(--muted);
        font-size: 0.76rem;
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }

      .chip {
        border-radius: 999px;
        border: 1px solid #ddd0bd;
        padding: 0.2rem 0.45rem;
        background: #fffaef;
      }

      .chip.good {
        border-color: #add9c2;
        color: var(--ok);
        background: #effcf4;
      }

      .chip.warn {
        border-color: #f0bca6;
        color: var(--warn);
        background: #fff1ea;
      }

      .main {
        display: grid;
        grid-template-rows: minmax(320px, 46vh) 1fr;
      }

      #map {
        width: 100%;
        height: 100%;
        border-bottom: 1px solid var(--line);
      }

      .details {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 0;
      }

      .schedule {
        padding: 1rem 1.1rem;
      }

      .schedule h2 {
        margin: 0 0 0.8rem;
        font-size: 1rem;
        font-weight: 700;
      }

      .timeline {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.55rem;
      }

      .timeline li {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fffcf6;
        padding: 0.62rem 0.72rem;
        display: grid;
        grid-template-columns: 38px 1fr auto;
        align-items: center;
        gap: 0.65rem;
      }

      .emoji {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #fff5df;
        border: 1px solid #ecd8be;
        font-size: 1.1rem;
      }

      .stop-title {
        margin: 0;
        font-size: 0.9rem;
      }

      .stop-meta {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.75rem;
      }

      .stop-time {
        text-align: right;
        font-size: 0.78rem;
        color: var(--muted);
        white-space: nowrap;
      }

      .visit-toggle {
        margin-top: 0.4rem;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.74rem;
        color: var(--muted);
        cursor: pointer;
      }

      .visit-toggle input {
        accent-color: var(--accent);
        cursor: pointer;
      }

      .timeline li.visited {
        opacity: 0.72;
        border-style: dashed;
      }

      .timeline li.visited .stop-title {
        text-decoration: line-through;
      }

      .summary {
        border-left: 1px solid var(--line);
        padding: 1rem;
        background: linear-gradient(180deg, #fff9ec 0%, #fff4e3 100%);
      }

      .summary h2 {
        margin: 0 0 0.6rem;
        font-size: 1rem;
      }

      .kpi {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.55rem;
      }

      .kpi > div {
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fffdf8;
        padding: 0.62rem;
      }

      .kpi .label {
        color: var(--muted);
        font-size: 0.73rem;
      }

      .kpi .value {
        margin-top: 0.25rem;
        font-size: 1rem;
        font-weight: 700;
      }

      .objective {
        margin: 0.85rem 0 0;
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.45;
      }

      .loading {
        padding: 1.2rem;
        color: var(--muted);
      }

      .home-dot {
        font-size: 1.1rem;
      }

      .stop-dot {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        border: 1px solid #d4c3aa;
        display: grid;
        place-items: center;
        background: #fff9eb;
        font-size: 0.8rem;
        font-weight: 700;
        color: #704f20;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          max-height: 36vh;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .main {
          grid-template-rows: 340px 1fr;
        }

        .details {
          grid-template-columns: 1fr;
        }

        .summary {
          border-left: none;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <h1 class="title">Gandia Day Trip Visualizer</h1>
          <p class="subtitle">Click a day trip to jump to its route and schedule.</p>
        </div>
        <div class="meta">
          <div id="metaCount">Loading plans...</div>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <h2>Day Trips</h2>
          </div>
          <div id="tripList" class="trip-list"></div>
        </aside>

        <section class="main">
          <div id="map"></div>
          <div class="details">
            <section class="schedule">
              <h2 id="scheduleTitle">Schedule</h2>
              <ul id="timeline" class="timeline"></ul>
            </section>
            <aside class="summary">
              <h2>Plan Metrics</h2>
              <div class="kpi">
                <div>
                  <div class="label">Total Drive</div>
                  <div id="kpiDrive" class="value">-</div>
                </div>
                <div>
                  <div class="label">Avg Rating</div>
                  <div id="kpiRating" class="value">-</div>
                </div>
                <div>
                  <div class="label">High-Rated Stops</div>
                  <div id="kpiHighRated" class="value">-</div>
                </div>
                <div>
                  <div class="label">Feasible</div>
                  <div id="kpiFeasible" class="value">-</div>
                </div>
              </div>
              <p id="objective" class="objective"></p>
              <p id="planNarrative" class="objective"></p>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const STAY_POINT = {
        name: "Stay",
        address: "Carrer Taronger 6, 46730 Gandia, Spain",
        lat: 38.997532,
        lon: -0.1573372,
      };

      const roleEmoji = {
        activity: "🧭",
        meal: "🍽️",
        drink: "☕",
        shopping: "🛍️",
      };

      const tripListEl = document.getElementById("tripList");
      const metaCountEl = document.getElementById("metaCount");
      const scheduleTitleEl = document.getElementById("scheduleTitle");
      const timelineEl = document.getElementById("timeline");
      const objectiveEl = document.getElementById("objective");
      const planNarrativeEl = document.getElementById("planNarrative");
      const kpiDriveEl = document.getElementById("kpiDrive");
      const kpiRatingEl = document.getElementById("kpiRating");
      const kpiHighRatedEl = document.getElementById("kpiHighRated");
      const kpiFeasibleEl = document.getElementById("kpiFeasible");
      const VISITED_STORAGE_KEY = "gandia-trip-visited-v1";

      const map = L.map("map", { zoomControl: true }).setView([STAY_POINT.lat, STAY_POINT.lon], 12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      const routeLayer = L.layerGroup().addTo(map);
      let plans = [];
      let selectedIndex = 0;

      function loadVisitedMap() {
        try {
          const raw = localStorage.getItem(VISITED_STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (_) {
          return {};
        }
      }

      function saveVisitedMap(map) {
        localStorage.setItem(VISITED_STORAGE_KEY, JSON.stringify(map));
      }

      function stopKey(planId, stop) {
        return `${planId}:${stop.order}:${stop.placeIndex}`;
      }

      function asNumber(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
      }

      function emojiFor(stop) {
        if (stop.role === "meal" && stop.mealSlot === "lunch") return "🥗";
        if (stop.role === "meal" && stop.mealSlot === "dinner") return "🍽️";
        if (stop.role === "drink" && /winery/i.test(stop.category || "")) return "🍷";
        return roleEmoji[stop.role] || "📍";
      }

      function renderTripList() {
        const visitedMap = loadVisitedMap();
        const visitedCount = plans.flatMap((p) => p.stops).filter((s, _, arr) => {
          const key = stopKey(
            plans.find((pp) => pp.stops.includes(s)).planId,
            s
          );
          return Boolean(visitedMap[key]);
        }).length;

        tripListEl.innerHTML = "";
        plans.forEach((plan, idx) => {
          const done = plan.stops.filter((s) => Boolean(visitedMap[stopKey(plan.planId, s)])).length;
          const btn = document.createElement("button");
          btn.className = "trip-item" + (idx === selectedIndex ? " active" : "");
          btn.type = "button";
          btn.dataset.index = String(idx);
          btn.innerHTML = `
            <h3>${plan.planId.toUpperCase()} · ${plan.title}</h3>
            <div class="row">
              <span class="chip">${plan.stops.length} stops</span>
              <span class="chip">${done}/${plan.stops.length} done</span>
              <span class="chip">${plan.estimatedTotalDriveMin} min drive</span>
              <span class="chip">${plan.highRatedStopCount} high-rated</span>
              <span class="chip ${plan.isFeasibleDayTrip ? "good" : "warn"}">${
                plan.isFeasibleDayTrip ? "Feasible" : "Review"
              }</span>
            </div>
          `;
          btn.addEventListener("click", () => {
            selectedIndex = idx;
            renderTripList();
            renderPlan(plan);
          });
          tripListEl.appendChild(btn);
        });

        metaCountEl.textContent = `${plans.length} plans loaded · ${visitedCount} stops completed`;
      }

      function markerIcon(text, className) {
        return L.divIcon({
          className: className,
          html: text,
          iconSize: [30, 30],
          iconAnchor: [15, 15],
        });
      }

      function renderMap(plan) {
        routeLayer.clearLayers();
        const points = [];

        const home = L.marker([STAY_POINT.lat, STAY_POINT.lon], {
          icon: markerIcon('<span class="home-dot">🏠</span>', ""),
        }).bindPopup(`<strong>${STAY_POINT.name}</strong><br>${STAY_POINT.address}`);
        routeLayer.addLayer(home);
        points.push([STAY_POINT.lat, STAY_POINT.lon]);

        plan.stops.forEach((stop) => {
          const lat = asNumber(stop.lat);
          const lon = asNumber(stop.lon);
          if (lat == null || lon == null) return;
          points.push([lat, lon]);

          const marker = L.marker([lat, lon], {
            icon: markerIcon(`<span class="stop-dot">${stop.order}</span>`, ""),
          }).bindPopup(
            `<strong>${emojiFor(stop)} ${stop.placeName}</strong><br>` +
              `${stop.role}${stop.mealSlot ? " · " + stop.mealSlot : ""}<br>` +
              `${stop.plannedTime} · ${stop.category || "No category"}<br>` +
              `${stop.rating ? "⭐ " + stop.rating : "No rating"}`
          );
          routeLayer.addLayer(marker);
        });

        points.push([STAY_POINT.lat, STAY_POINT.lon]);
        if (points.length >= 2) {
          routeLayer.addLayer(
            L.polyline(points, {
              color: "#127a76",
              weight: 4,
              opacity: 0.85,
            })
          );
          map.fitBounds(L.latLngBounds(points), { padding: [28, 28] });
        }
      }

      function renderSchedule(plan) {
        scheduleTitleEl.textContent = `${plan.planId.toUpperCase()} Schedule`;
        timelineEl.innerHTML = "";
        const visitedMap = loadVisitedMap();

        plan.stops
          .slice()
          .sort((a, b) => a.order - b.order)
          .forEach((stop) => {
            const checked = Boolean(visitedMap[stopKey(plan.planId, stop)]);
            const li = document.createElement("li");
            li.className = checked ? "visited" : "";
            const drive = stop.estimatedDriveMinFromPrevious == null ? "?" : stop.estimatedDriveMinFromPrevious;
            li.innerHTML = `
              <div class="emoji">${emojiFor(stop)}</div>
              <div>
                <p class="stop-title">${stop.order}. ${stop.placeName}</p>
                <p class="stop-meta">${stop.role}${stop.mealSlot ? " · " + stop.mealSlot : ""} · ${
              stop.category || "No category"
            } · Drive from previous: ${drive} min</p>
                <label class="visit-toggle">
                  <input type="checkbox" data-plan="${plan.planId}" data-order="${stop.order}" data-index="${stop.placeIndex}" ${
              checked ? "checked" : ""
            } />
                  Mark visited
                </label>
              </div>
              <div class="stop-time">${stop.plannedTime}</div>
            `;
            timelineEl.appendChild(li);
          });

        timelineEl.querySelectorAll("input[type='checkbox']").forEach((input) => {
          input.addEventListener("change", (evt) => {
            const target = evt.currentTarget;
            const key = `${target.dataset.plan}:${target.dataset.order}:${target.dataset.index}`;
            const visited = loadVisitedMap();
            visited[key] = target.checked;
            saveVisitedMap(visited);
            renderTripList();
            renderSchedule(plan);
          });
        });
      }

      function renderKpi(plan) {
        objectiveEl.textContent = plan.objective || "";
        planNarrativeEl.textContent = plan.stops[0]?.partOfPlan
          ? `Plan flow: ${plan.stops[0].partOfPlan}`
          : "";
        kpiDriveEl.textContent = `${plan.estimatedTotalDriveMin || "-"} min`;
        kpiRatingEl.textContent = plan.averageStopRating != null ? String(plan.averageStopRating) : "-";
        kpiHighRatedEl.textContent = String(plan.highRatedStopCount || 0);
        kpiFeasibleEl.textContent = plan.isFeasibleDayTrip ? "Yes" : "Review";
        kpiFeasibleEl.style.color = plan.isFeasibleDayTrip ? "var(--ok)" : "var(--warn)";
      }

      function renderPlan(plan) {
        renderMap(plan);
        renderSchedule(plan);
        renderKpi(plan);
      }

      function normalizePlans(input) {
        return Array.isArray(input) ? input : [];
      }

      function showLoadingError(msg) {
        tripListEl.innerHTML = `<div class="loading">${msg}</div>`;
        metaCountEl.textContent = "No plans loaded";
      }

      async function bootstrap() {
        try {
          const response = await fetch("./day_trip_plans.json", { cache: "no-store" });
          if (!response.ok) {
            throw new Error("Could not read day_trip_plans.json");
          }
          plans = normalizePlans(await response.json());
          if (!plans.length) throw new Error("No plan data found.");
        } catch (err) {
          showLoadingError(
            "Could not load day_trip_plans.json. Serve this folder with a local web server, then reload."
          );
          console.error(err);
          return;
        }

        selectedIndex = 0;
        renderTripList();
        renderPlan(plans[selectedIndex]);
      }

      bootstrap();
    </script>
  </body>
</html>
