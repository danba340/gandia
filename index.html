<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gandia Trip Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        --bg-1: #fff3dc;
        --bg-2: #ffe0b8;
        --panel: #fffaf2;
        --ink: #1f2a2f;
        --muted: #5e6b71;
        --line: #e2d6c4;
        --accent: #127a76;
        --accent-2: #ea6f2d;
        --ok: #1d8f52;
        --warn: #a84e2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Sora", "Segoe UI", sans-serif;
        background: radial-gradient(circle at 10% 15%, #fff9ee 0%, transparent 40%),
          radial-gradient(circle at 85% 8%, #ffd8ab 0%, transparent 36%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
      }

      .shell {
        width: min(1280px, calc(100vw - 2rem));
        margin: 1rem auto;
        border: 1px solid #decfb8;
        border-radius: 22px;
        overflow: hidden;
        backdrop-filter: blur(5px);
        box-shadow: 0 18px 40px rgba(120, 85, 42, 0.15);
        background: rgba(255, 253, 247, 0.92);
      }

      .hidden {
        display: none !important;
      }

      .topbar {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .title {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 700;
        letter-spacing: 0.2px;
        font-size: clamp(1.1rem, 1.2vw + 0.8rem, 1.7rem);
      }

      .subtitle {
        margin: 0.2rem 0 0;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .meta {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        color: var(--muted);
        font-size: 0.8rem;
        text-align: right;
      }

      .mode-toggle {
        display: inline-flex;
        align-self: flex-end;
        border: 1px solid #d8c7ad;
        border-radius: 999px;
        overflow: hidden;
        background: #fff7e9;
      }

      .mode-btn {
        border: 0;
        background: transparent;
        color: #70583a;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.15px;
        padding: 0.4rem 0.7rem;
        cursor: pointer;
      }

      .mode-btn + .mode-btn {
        border-left: 1px solid #d8c7ad;
      }

      .mode-btn.active {
        background: #127a76;
        color: #fff;
      }

      .layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        min-height: 78vh;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        background: linear-gradient(180deg, #fff8ec 0%, #fff5e4 100%);
        overflow: auto;
      }

      .sidebar-header {
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 0.95rem 0.95rem 0.8rem;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 249, 236, 0.95);
        backdrop-filter: blur(3px);
      }

      .sidebar-header h2 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .sidebar-hint {
        margin: 0.3rem 0 0;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .places-tools {
        margin-top: 0.6rem;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.32rem;
        border: 1px solid #d9c9b1;
        border-radius: 999px;
        background: #fffaf0;
        color: #6a5538;
        font-size: 0.72rem;
        font-weight: 600;
        line-height: 1;
        padding: 0.36rem 0.58rem;
        cursor: pointer;
      }

      .filter-chip:hover {
        border-color: #bca88d;
      }

      .filter-chip.active {
        background: #127a76;
        border-color: #127a76;
        color: #fff;
      }

      .trip-list {
        display: grid;
        gap: 0.6rem;
        padding: 0.85rem;
      }

      .trip-item,
      .place-item {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fffefb;
        padding: 0.7rem;
        text-align: left;
        cursor: pointer;
        transition: 0.18s transform ease, 0.18s border-color ease, 0.18s background ease;
      }

      .trip-item:hover,
      .place-item:hover {
        transform: translateY(-1px);
        border-color: #c7b49d;
      }

      .trip-item.active,
      .place-item.active {
        border-color: var(--accent);
        background: #f1fdfc;
      }

      .trip-item h3,
      .place-item h3 {
        margin: 0;
        font-size: 0.92rem;
      }

      .trip-item .row,
      .place-item .row {
        margin-top: 0.45rem;
        color: var(--muted);
        font-size: 0.76rem;
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }

      .chip {
        border-radius: 999px;
        border: 1px solid #ddd0bd;
        padding: 0.2rem 0.45rem;
        background: #fffaef;
      }

      .chip.good {
        border-color: #add9c2;
        color: var(--ok);
        background: #effcf4;
      }

      .chip.warn {
        border-color: #f0bca6;
        color: var(--warn);
        background: #fff1ea;
      }

      .place-group {
        padding: 0.35rem 0.85rem 0.85rem;
        border-bottom: 1px solid #eddcc3;
      }

      .place-group:last-child {
        border-bottom: 0;
      }

      .place-group-title {
        margin: 0.3rem 0 0.55rem;
        font-size: 0.82rem;
        font-weight: 700;
        color: #7a6647;
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      .color-dot {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        display: inline-block;
        flex-shrink: 0;
      }

      .place-group-items {
        display: grid;
        gap: 0.46rem;
      }

      .main {
        display: grid;
        grid-template-rows: minmax(320px, 46vh) 1fr;
      }

      .map-wrap {
        position: relative;
      }

      .map-controls {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 450;
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      .map-control-btn {
        border: 1px solid #d6c5ab;
        background: rgba(255, 250, 240, 0.96);
        color: #5c4b35;
        border-radius: 999px;
        font-size: 0.74rem;
        font-weight: 700;
        padding: 0.38rem 0.62rem;
        cursor: pointer;
        white-space: nowrap;
      }

      .map-control-btn:hover {
        border-color: #bda88a;
      }

      .map-control-btn:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .map-status {
        border-radius: 999px;
        border: 1px solid #d6c5ab;
        background: rgba(255, 250, 240, 0.96);
        color: #6e5d44;
        font-size: 0.68rem;
        font-weight: 600;
        padding: 0.2rem 0.45rem;
        display: none;
      }

      .map-status.show {
        display: inline-flex;
      }

      .map-status.error {
        border-color: #edb4a8;
        color: #9c4a34;
        background: rgba(255, 241, 234, 0.97);
      }

      #map {
        width: 100%;
        height: 100%;
        border-bottom: 1px solid var(--line);
      }

      .map-legend {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 450;
        max-width: min(320px, calc(100% - 24px));
        padding: 0.62rem 0.68rem;
        border: 1px solid #d8c7ad;
        border-radius: 12px;
        background: rgba(255, 250, 240, 0.95);
        backdrop-filter: blur(3px);
      }

      .map-legend-title {
        margin: 0 0 0.45rem;
        font-size: 0.74rem;
        font-weight: 700;
        color: #6e5c43;
      }

      .map-legend-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 0.3rem 0.65rem;
      }

      .legend-item {
        font-size: 0.71rem;
        color: #554734;
        display: inline-flex;
        align-items: center;
        gap: 0.36rem;
        min-width: 0;
      }

      .legend-item span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .details {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 0;
      }

      .schedule {
        padding: 1rem 1.1rem;
      }

      .schedule h2 {
        margin: 0 0 0.8rem;
        font-size: 1rem;
        font-weight: 700;
      }

      .timeline {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.55rem;
      }

      .timeline li {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fffcf6;
        padding: 0.62rem 0.72rem;
        display: grid;
        grid-template-columns: 38px 1fr auto;
        align-items: center;
        gap: 0.65rem;
      }

      .emoji {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #fff5df;
        border: 1px solid #ecd8be;
        font-size: 1.1rem;
      }

      .stop-title {
        margin: 0;
        font-size: 0.9rem;
      }

      .stop-meta {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.75rem;
      }

      .stop-time {
        text-align: right;
        font-size: 0.78rem;
        color: var(--muted);
        white-space: nowrap;
      }

      .visit-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.74rem;
        color: var(--muted);
        cursor: pointer;
      }

      .visit-toggle input {
        accent-color: var(--accent);
        cursor: pointer;
      }

      .stop-actions {
        margin-top: 0.4rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .maps-link,
      .jump-plan {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.22rem 0.5rem;
        border-radius: 999px;
        border: 1px solid #d6c5ab;
        text-decoration: none;
        font-size: 0.72rem;
        font-weight: 600;
        color: #5b4f3b;
        background: #fff8ea;
      }

      .jump-plan {
        cursor: pointer;
      }

      .maps-link:hover,
      .jump-plan:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .timeline li.visited {
        opacity: 0.72;
        border-style: dashed;
      }

      .timeline li.visited .stop-title {
        text-decoration: line-through;
      }

      .place-details {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fffdf7;
        padding: 0.8rem;
      }

      .place-details h3 {
        margin: 0;
        font-size: 0.98rem;
      }

      .place-details .sub {
        margin: 0.35rem 0 0;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .detail-grid {
        margin-top: 0.65rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
      }

      .detail-grid > div {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fffaf0;
        padding: 0.5rem;
      }

      .detail-grid .label {
        color: var(--muted);
        font-size: 0.7rem;
      }

      .detail-grid .value {
        margin-top: 0.18rem;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .ref-plans {
        margin-top: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .summary {
        border-left: 1px solid var(--line);
        padding: 1rem;
        background: linear-gradient(180deg, #fff9ec 0%, #fff4e3 100%);
      }

      .summary h2 {
        margin: 0 0 0.6rem;
        font-size: 1rem;
      }

      .kpi {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.55rem;
      }

      .kpi > div {
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fffdf8;
        padding: 0.62rem;
      }

      .kpi .label {
        color: var(--muted);
        font-size: 0.73rem;
      }

      .kpi .value {
        margin-top: 0.25rem;
        font-size: 1rem;
        font-weight: 700;
      }

      .objective {
        margin: 0.85rem 0 0;
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.45;
      }

      .loading {
        padding: 1.2rem;
        color: var(--muted);
      }

      .home-dot {
        font-size: 1.1rem;
      }

      .stop-dot {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        border: 1px solid #d4c3aa;
        display: grid;
        place-items: center;
        background: #fff9eb;
        font-size: 0.8rem;
        font-weight: 700;
        color: #704f20;
      }

      .legend-summary {
        margin-top: 0.7rem;
        display: grid;
        gap: 0.35rem;
      }

      .legend-summary-item {
        font-size: 0.76rem;
        color: #5e4f3a;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          max-height: 40vh;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .main {
          grid-template-rows: 340px 1fr;
        }

        .details {
          grid-template-columns: 1fr;
        }

        .summary {
          border-left: none;
          border-top: 1px solid var(--line);
        }

        .map-legend-grid {
          grid-template-columns: 1fr;
        }

        .map-controls {
          left: 10px;
          top: 10px;
          right: 10px;
          gap: 0.35rem;
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <h1 class="title">Gandia Trip Visualizer</h1>
          <p id="subtitleText" class="subtitle">Click a day trip to jump to its route and schedule.</p>
        </div>
        <div class="meta">
          <div class="mode-toggle">
            <button id="modeTripsBtn" class="mode-btn active" type="button">Day Trips</button>
            <button id="modePlacesBtn" class="mode-btn" type="button">Places</button>
          </div>
          <div id="metaCount">Loading plans...</div>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <h2 id="sidebarTitle">Day Trips</h2>
            <p id="sidebarHint" class="sidebar-hint">Choose a route to render on the map.</p>
            <div id="placesTools" class="places-tools hidden">
              <div id="categoryFilterRow" class="filter-row"></div>
            </div>
          </div>
          <div id="listPanel" class="trip-list"></div>
        </aside>

        <section class="main">
          <div class="map-wrap">
            <div id="map"></div>
            <div class="map-controls">
              <button id="locateMeBtn" class="map-control-btn" type="button">Locate me</button>
              <span id="locateStatus" class="map-status"></span>
            </div>
            <div id="mapLegend" class="map-legend hidden"></div>
          </div>
          <div class="details">
            <section class="schedule">
              <h2 id="scheduleTitle">Schedule</h2>
              <ul id="timeline" class="timeline"></ul>
              <div id="placeDetails" class="place-details hidden"></div>
            </section>
            <aside class="summary">
              <h2 id="summaryTitle">Plan Metrics</h2>

              <div id="tripSummaryBlock">
                <div class="kpi">
                  <div>
                    <div class="label">Total Drive</div>
                    <div id="kpiDrive" class="value">-</div>
                  </div>
                  <div>
                    <div class="label">Avg Rating</div>
                    <div id="kpiRating" class="value">-</div>
                  </div>
                  <div>
                    <div class="label">High-Rated Stops</div>
                    <div id="kpiHighRated" class="value">-</div>
                  </div>
                  <div>
                    <div class="label">Feasible</div>
                    <div id="kpiFeasible" class="value">-</div>
                  </div>
                </div>
                <p id="objective" class="objective"></p>
                <p id="planNarrative" class="objective"></p>
              </div>

              <div id="placesSummaryBlock" class="hidden">
                <p id="placesSummaryText" class="objective"></p>
                <div id="legendSummary" class="legend-summary"></div>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const STAY_POINT = {
        name: "Stay",
        address: "Carrer Taronger 6, 46730 Gandia, Spain",
        lat: 38.997532,
        lon: -0.1573372,
      };

      const roleEmoji = {
        activity: "🧭",
        meal: "🍽️",
        drink: "☕",
        shopping: "🛍️",
      };

      const categoryPalette = [
        "#e76f51",
        "#f4a261",
        "#2a9d8f",
        "#457b9d",
        "#8d5a97",
        "#e9c46a",
        "#5f0f40",
        "#2f4858",
        "#4d7c0f",
        "#d62828",
        "#3a86ff",
        "#ff006e",
        "#6c757d",
        "#0096c7",
      ];

      const VISITED_STORAGE_KEY = "gandia-trip-visited-v1";
      const PLACE_VISITED_STORAGE_KEY = "gandia-place-visited-v1";

      const subtitleTextEl = document.getElementById("subtitleText");
      const modeTripsBtnEl = document.getElementById("modeTripsBtn");
      const modePlacesBtnEl = document.getElementById("modePlacesBtn");
      const sidebarTitleEl = document.getElementById("sidebarTitle");
      const sidebarHintEl = document.getElementById("sidebarHint");
      const placesToolsEl = document.getElementById("placesTools");
      const categoryFilterRowEl = document.getElementById("categoryFilterRow");
      const listPanelEl = document.getElementById("listPanel");
      const metaCountEl = document.getElementById("metaCount");
      const mapLegendEl = document.getElementById("mapLegend");
      const locateMeBtnEl = document.getElementById("locateMeBtn");
      const locateStatusEl = document.getElementById("locateStatus");

      const scheduleTitleEl = document.getElementById("scheduleTitle");
      const timelineEl = document.getElementById("timeline");
      const placeDetailsEl = document.getElementById("placeDetails");
      const summaryTitleEl = document.getElementById("summaryTitle");

      const tripSummaryBlockEl = document.getElementById("tripSummaryBlock");
      const placesSummaryBlockEl = document.getElementById("placesSummaryBlock");
      const placesSummaryTextEl = document.getElementById("placesSummaryText");
      const legendSummaryEl = document.getElementById("legendSummary");

      const objectiveEl = document.getElementById("objective");
      const planNarrativeEl = document.getElementById("planNarrative");
      const kpiDriveEl = document.getElementById("kpiDrive");
      const kpiRatingEl = document.getElementById("kpiRating");
      const kpiHighRatedEl = document.getElementById("kpiHighRated");
      const kpiFeasibleEl = document.getElementById("kpiFeasible");

      const map = L.map("map", { zoomControl: true }).setView([STAY_POINT.lat, STAY_POINT.lon], 12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      const tripLayer = L.layerGroup().addTo(map);
      const placesLayer = L.layerGroup().addTo(map);
      const overlayLayer = L.layerGroup().addTo(map);
      const userLayer = L.layerGroup().addTo(map);

      let plans = [];
      let places = [];
      let activeMode = "trips";
      let selectedTripIndex = 0;
      let selectedPlaceIndex = null;
      let categoryColorMap = new Map();
      let activeCategoryFilter = "all";
      let locateStatusTimer = null;

      function loadStorageMap(key) {
        try {
          const raw = localStorage.getItem(key);
          const parsed = raw ? JSON.parse(raw) : {};
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (_) {
          return {};
        }
      }

      function saveStorageMap(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function stopKey(planId, stop) {
        return `${planId}:${stop.order}:${stop.placeIndex}`;
      }

      function placeVisitedKey(placeIndex) {
        return `place:${placeIndex}`;
      }

      function asNumber(value) {
        const n = Number(value);
        return Number.isFinite(n) ? n : null;
      }

      function toFixedOrDash(value, digits = 1) {
        const n = asNumber(value);
        return n == null ? "-" : n.toFixed(digits);
      }

      function haversineKm(aLat, aLon, bLat, bLon) {
        const R = 6371;
        const p1 = (aLat * Math.PI) / 180;
        const p2 = (bLat * Math.PI) / 180;
        const dp = ((bLat - aLat) * Math.PI) / 180;
        const dl = ((bLon - aLon) * Math.PI) / 180;
        const x =
          Math.sin(dp / 2) ** 2 +
          Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(x));
      }

      function emojiFor(stop) {
        if (stop.role === "meal" && stop.mealSlot === "lunch") return "🥗";
        if (stop.role === "meal" && stop.mealSlot === "dinner") return "🍽️";
        if (stop.role === "drink" && /winery/i.test(stop.category || "")) return "🍷";
        return roleEmoji[stop.role] || "📍";
      }

      function markerIcon(text) {
        return L.divIcon({
          className: "",
          html: text,
          iconSize: [30, 30],
          iconAnchor: [15, 15],
        });
      }

      function categoryForPlace(place) {
        return (place.category && place.category.trim()) ||
          (place.location && place.location.trim()) ||
          "Uncategorized";
      }

      function buildCategoryColors() {
        const categories = [...new Set(places.map((p) => categoryForPlace(p)))].sort((a, b) =>
          a.localeCompare(b)
        );
        categoryColorMap = new Map();
        categories.forEach((category, index) => {
          categoryColorMap.set(category, categoryPalette[index % categoryPalette.length]);
        });
      }

      function colorForCategory(category) {
        return categoryColorMap.get(category) || "#5e6b71";
      }

      function getFilteredPlaces() {
        if (activeCategoryFilter === "all") return places.slice();
        return places.filter((place) => categoryForPlace(place) === activeCategoryFilter);
      }

      function setLocateStatus(text, isError = false) {
        locateStatusEl.textContent = text;
        locateStatusEl.classList.toggle("error", isError);
        locateStatusEl.classList.add("show");

        if (locateStatusTimer) {
          clearTimeout(locateStatusTimer);
        }

        locateStatusTimer = setTimeout(() => {
          locateStatusEl.classList.remove("show");
        }, 3600);
      }

      function locateMe() {
        if (!navigator.geolocation) {
          setLocateStatus("Geolocation unavailable on this browser.", true);
          return;
        }

        locateMeBtnEl.disabled = true;
        setLocateStatus("Locating...");

        navigator.geolocation.getCurrentPosition(
          (position) => {
            locateMeBtnEl.disabled = false;
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracyMeters = position.coords.accuracy;

            userLayer.clearLayers();
            userLayer.addLayer(
              L.circleMarker([lat, lon], {
                radius: 8,
                color: "#1b4f7d",
                weight: 2,
                fillColor: "#3a86ff",
                fillOpacity: 0.9,
              }).bindPopup("<strong>You are here</strong>")
            );

            if (Number.isFinite(accuracyMeters) && accuracyMeters > 0) {
              userLayer.addLayer(
                L.circle([lat, lon], {
                  radius: accuracyMeters,
                  color: "#3a86ff",
                  weight: 1,
                  fillColor: "#3a86ff",
                  fillOpacity: 0.1,
                })
              );
            }

            map.flyTo([lat, lon], Math.max(map.getZoom(), 12), { duration: 0.8 });
            setLocateStatus("Location found.");
          },
          (error) => {
            locateMeBtnEl.disabled = false;
            let message = "Could not determine your location.";
            if (error.code === error.PERMISSION_DENIED) {
              message = "Location permission denied.";
            } else if (error.code === error.POSITION_UNAVAILABLE) {
              message = "Location unavailable.";
            } else if (error.code === error.TIMEOUT) {
              message = "Location request timed out.";
            }
            setLocateStatus(message, true);
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 60000,
          }
        );
      }

      function renderCategoryFilters() {
        const categories = [...categoryColorMap.keys()].sort((a, b) => a.localeCompare(b));
        if (!categories.includes(activeCategoryFilter)) {
          activeCategoryFilter = "all";
        }

        const totalPlaces = places.length;
        const chips = [
          { key: "all", label: `All (${totalPlaces})`, color: null },
          ...categories.map((category) => ({
            key: category,
            label: `${category} (${places.filter((p) => categoryForPlace(p) === category).length})`,
            color: colorForCategory(category),
          })),
        ];

        categoryFilterRowEl.innerHTML = "";
        chips.forEach((chip) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "filter-chip" + (chip.key === activeCategoryFilter ? " active" : "");
          btn.innerHTML = `${
            chip.color ? `<span class="color-dot" style="background:${chip.color};"></span>` : ""
          }${chip.label}`;
          btn.addEventListener("click", () => {
            activeCategoryFilter = chip.key;
            const filtered = getFilteredPlaces();
            if (!filtered.some((p) => Number(p.index) === Number(selectedPlaceIndex))) {
              selectedPlaceIndex = filtered[0] ? Number(filtered[0].index) : null;
            }
            renderPlacesView();
          });
          categoryFilterRowEl.appendChild(btn);
        });
      }

      function stopGoogleMapsUrl(stop) {
        const query = [stop.placeName, stop.category, "Gandia", "Valencia", "Spain"]
          .filter(Boolean)
          .join(", ");
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      }

      function placeGoogleMapsUrl(place) {
        const query = [place.name, categoryForPlace(place), "Gandia", "Valencia", "Spain"]
          .filter(Boolean)
          .join(", ");
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      }

      function getPlanRefsForPlace(placeIndex) {
        return plans.filter((plan) =>
          plan.stops.some((stop) => Number(stop.placeIndex) === Number(placeIndex))
        );
      }

      function clearMapLayers() {
        tripLayer.clearLayers();
        placesLayer.clearLayers();
        overlayLayer.clearLayers();
      }

      function renderTripList() {
        const visitedMap = loadStorageMap(VISITED_STORAGE_KEY);
        const allStops = plans.flatMap((p) => p.stops.map((s) => ({ planId: p.planId, stop: s })));
        const visitedCount = allStops.filter((entry) => visitedMap[stopKey(entry.planId, entry.stop)]).length;

        listPanelEl.innerHTML = "";
        plans.forEach((plan, idx) => {
          const done = plan.stops.filter((s) => Boolean(visitedMap[stopKey(plan.planId, s)])).length;
          const btn = document.createElement("button");
          btn.className = "trip-item" + (idx === selectedTripIndex ? " active" : "");
          btn.type = "button";
          btn.dataset.index = String(idx);
          btn.innerHTML = `
            <h3>${plan.planId.toUpperCase()} · ${plan.title}</h3>
            <div class="row">
              <span class="chip">${plan.stops.length} stops</span>
              <span class="chip">${done}/${plan.stops.length} done</span>
              <span class="chip">${plan.estimatedTotalDriveMin} min drive</span>
              <span class="chip">${plan.highRatedStopCount} high-rated</span>
              <span class="chip ${plan.isFeasibleDayTrip ? "good" : "warn"}">${
                plan.isFeasibleDayTrip ? "Feasible" : "Review"
              }</span>
            </div>
          `;
          btn.addEventListener("click", () => {
            selectedTripIndex = idx;
            renderTripList();
            renderTripView();
          });
          listPanelEl.appendChild(btn);
        });

        metaCountEl.textContent = `${plans.length} plans loaded · ${visitedCount} stops completed`;
      }

      function renderTripMap(plan) {
        clearMapLayers();
        mapLegendEl.classList.add("hidden");

        const points = [];
        tripLayer.addLayer(
          L.marker([STAY_POINT.lat, STAY_POINT.lon], {
            icon: markerIcon('<span class="home-dot">🏠</span>'),
          }).bindPopup(`<strong>${STAY_POINT.name}</strong><br>${STAY_POINT.address}`)
        );
        points.push([STAY_POINT.lat, STAY_POINT.lon]);

        plan.stops.forEach((stop) => {
          const lat = asNumber(stop.lat);
          const lon = asNumber(stop.lon);
          if (lat == null || lon == null) return;

          points.push([lat, lon]);
          tripLayer.addLayer(
            L.marker([lat, lon], {
              icon: markerIcon(`<span class="stop-dot">${stop.order}</span>`),
            }).bindPopup(
              `<strong>${emojiFor(stop)} ${stop.placeName}</strong><br>` +
                `${stop.role}${stop.mealSlot ? " · " + stop.mealSlot : ""}<br>` +
                `${stop.plannedTime} · ${stop.category || "No category"}<br>` +
                `${stop.rating ? "⭐ " + stop.rating : "No rating"}`
            )
          );
        });

        points.push([STAY_POINT.lat, STAY_POINT.lon]);
        if (points.length >= 2) {
          tripLayer.addLayer(
            L.polyline(points, {
              color: "#127a76",
              weight: 4,
              opacity: 0.85,
            })
          );
          map.fitBounds(L.latLngBounds(points), { padding: [28, 28] });
        }
      }

      function renderTripSchedule(plan) {
        timelineEl.innerHTML = "";
        const visitedMap = loadStorageMap(VISITED_STORAGE_KEY);

        plan.stops
          .slice()
          .sort((a, b) => a.order - b.order)
          .forEach((stop) => {
            const checked = Boolean(visitedMap[stopKey(plan.planId, stop)]);
            const mapsUrl = stopGoogleMapsUrl(stop);
            const li = document.createElement("li");
            li.className = checked ? "visited" : "";
            const drive =
              stop.estimatedDriveMinFromPrevious == null ? "?" : stop.estimatedDriveMinFromPrevious;

            li.innerHTML = `
              <div class="emoji">${emojiFor(stop)}</div>
              <div>
                <p class="stop-title">${stop.order}. ${stop.placeName}</p>
                <p class="stop-meta">${stop.role}${stop.mealSlot ? " · " + stop.mealSlot : ""} · ${
              stop.category || "No category"
            } · Drive from previous: ${drive} min</p>
                <div class="stop-actions">
                  <label class="visit-toggle">
                    <input type="checkbox" data-plan="${plan.planId}" data-order="${stop.order}" data-index="${
              stop.placeIndex
            }" ${checked ? "checked" : ""} />
                    Mark visited
                  </label>
                  <a class="maps-link" href="${mapsUrl}" target="_blank" rel="noopener noreferrer">Google Maps</a>
                </div>
              </div>
              <div class="stop-time">${stop.plannedTime}</div>
            `;
            timelineEl.appendChild(li);
          });

        timelineEl.querySelectorAll("input[type='checkbox']").forEach((input) => {
          input.addEventListener("change", (event) => {
            const target = event.currentTarget;
            const key = `${target.dataset.plan}:${target.dataset.order}:${target.dataset.index}`;
            const visited = loadStorageMap(VISITED_STORAGE_KEY);
            visited[key] = target.checked;
            saveStorageMap(VISITED_STORAGE_KEY, visited);
            renderTripList();
            renderTripSchedule(plan);
          });
        });
      }

      function renderTripSummary(plan) {
        objectiveEl.textContent = plan.objective || "";
        planNarrativeEl.textContent =
          plan.stops[0]?.partOfPlan ? `Plan flow: ${plan.stops[0].partOfPlan}` : "";
        kpiDriveEl.textContent = `${plan.estimatedTotalDriveMin || "-"} min`;
        kpiRatingEl.textContent = plan.averageStopRating != null ? String(plan.averageStopRating) : "-";
        kpiHighRatedEl.textContent = String(plan.highRatedStopCount || 0);
        kpiFeasibleEl.textContent = plan.isFeasibleDayTrip ? "Yes" : "Review";
        kpiFeasibleEl.style.color = plan.isFeasibleDayTrip ? "var(--ok)" : "var(--warn)";
      }

      function renderTripView() {
        const plan = plans[selectedTripIndex];
        if (!plan) return;

        scheduleTitleEl.textContent = `${plan.planId.toUpperCase()} Schedule`;
        renderTripMap(plan);
        renderTripSchedule(plan);
        renderTripSummary(plan);
      }

      function renderPlacesList(filteredPlaces) {
        const visiblePlaces = Array.isArray(filteredPlaces) ? filteredPlaces : getFilteredPlaces();
        const placeVisitedMap = loadStorageMap(PLACE_VISITED_STORAGE_KEY);
        const groups = new Map();

        visiblePlaces.forEach((place) => {
          const category = categoryForPlace(place);
          if (!groups.has(category)) groups.set(category, []);
          groups.get(category).push(place);
        });

        const sortedCategories = [...groups.keys()].sort((a, b) => {
          const countDiff = groups.get(b).length - groups.get(a).length;
          return countDiff !== 0 ? countDiff : a.localeCompare(b);
        });

        listPanelEl.innerHTML = "";
        if (!sortedCategories.length) {
          listPanelEl.innerHTML =
            '<div class="loading">No places match the selected category filter.</div>';
          metaCountEl.textContent = `0 / ${places.length} places`;
          return;
        }

        sortedCategories.forEach((category) => {
          const wrapper = document.createElement("section");
          wrapper.className = "place-group";

          const heading = document.createElement("h3");
          heading.className = "place-group-title";
          heading.innerHTML = `<span class="color-dot" style="background:${colorForCategory(
            category
          )}"></span>${category} <span class="chip">${groups.get(category).length}</span>`;
          wrapper.appendChild(heading);

          const itemsWrap = document.createElement("div");
          itemsWrap.className = "place-group-items";

          groups
            .get(category)
            .slice()
            .sort((a, b) => {
              const ar = asNumber(a.rating) || -1;
              const br = asNumber(b.rating) || -1;
              if (br !== ar) return br - ar;
              return String(a.name).localeCompare(String(b.name));
            })
            .forEach((place) => {
              const btn = document.createElement("button");
              const isActive = Number(selectedPlaceIndex) === Number(place.index);
              btn.className = "place-item" + (isActive ? " active" : "");
              btn.type = "button";
              btn.innerHTML = `
                <h3>${place.name}</h3>
                <div class="row">
                  <span class="chip">⭐ ${place.rating || "-"}</span>
                  <span class="chip">${toFixedOrDash(
                    haversineKm(STAY_POINT.lat, STAY_POINT.lon, Number(place.lat), Number(place.lon)),
                    1
                  )} km</span>
                  <span class="chip ${placeVisitedMap[placeVisitedKey(place.index)] ? "good" : ""}">${
                placeVisitedMap[placeVisitedKey(place.index)] ? "Visited" : "Not visited"
              }</span>
                </div>
              `;
              btn.addEventListener("click", () => {
                selectedPlaceIndex = Number(place.index);
                renderPlacesView();
              });
              itemsWrap.appendChild(btn);
            });

          wrapper.appendChild(itemsWrap);
          listPanelEl.appendChild(wrapper);
        });

        const visibleCategories = new Set(visiblePlaces.map((p) => categoryForPlace(p))).size;
        metaCountEl.textContent = `${visiblePlaces.length} / ${places.length} places · ${visibleCategories} categories`;
      }

      function renderPlacesLegend(filteredPlaces) {
        const visiblePlaces = Array.isArray(filteredPlaces) ? filteredPlaces : getFilteredPlaces();
        const categories = [...new Set(visiblePlaces.map((p) => categoryForPlace(p)))].sort((a, b) =>
          a.localeCompare(b)
        );

        if (!categories.length) {
          mapLegendEl.classList.add("hidden");
          legendSummaryEl.innerHTML = "";
          return;
        }

        mapLegendEl.innerHTML = `
          <p class="map-legend-title">Category Colors</p>
          <div class="map-legend-grid">
            ${categories
              .map(
                (category) => `
              <div class="legend-item">
                <span class="color-dot" style="background:${colorForCategory(category)}"></span>
                <span>${category}</span>
              </div>
            `
              )
              .join("")}
          </div>
        `;
        mapLegendEl.classList.remove("hidden");

        legendSummaryEl.innerHTML = categories
          .map((category) => {
            const count = visiblePlaces.filter((p) => categoryForPlace(p) === category).length;
            return `<div class="legend-summary-item"><span class="color-dot" style="background:${colorForCategory(
              category
            )}"></span>${category}: ${count}</div>`;
          })
          .join("");
      }

      function renderPlacesMap(selectedPlace, filteredPlaces) {
        const visiblePlaces = Array.isArray(filteredPlaces) ? filteredPlaces : getFilteredPlaces();
        clearMapLayers();

        const homeMarker = L.marker([STAY_POINT.lat, STAY_POINT.lon], {
          icon: markerIcon('<span class="home-dot">🏠</span>'),
        }).bindPopup(`<strong>${STAY_POINT.name}</strong><br>${STAY_POINT.address}`);
        placesLayer.addLayer(homeMarker);

        const allBounds = [[STAY_POINT.lat, STAY_POINT.lon]];

        visiblePlaces.forEach((place) => {
          const lat = asNumber(place.lat);
          const lon = asNumber(place.lon);
          if (lat == null || lon == null) return;

          allBounds.push([lat, lon]);
          const category = categoryForPlace(place);
          const isSelected = selectedPlace && Number(place.index) === Number(selectedPlace.index);

          const marker = L.circleMarker([lat, lon], {
            radius: isSelected ? 8 : 6,
            color: isSelected ? "#111" : colorForCategory(category),
            weight: isSelected ? 2.5 : 1.4,
            fillColor: colorForCategory(category),
            fillOpacity: isSelected ? 1 : 0.84,
          }).bindPopup(
            `<strong>${place.name}</strong><br>${category}<br>${
              place.rating ? "⭐ " + place.rating : "No rating"
            }`
          );

          placesLayer.addLayer(marker);

          if (isSelected) {
            marker.openPopup();
          }
        });

        if (selectedPlace) {
          const slat = asNumber(selectedPlace.lat);
          const slon = asNumber(selectedPlace.lon);
          if (slat != null && slon != null) {
            overlayLayer.addLayer(
              L.polyline(
                [
                  [STAY_POINT.lat, STAY_POINT.lon],
                  [slat, slon],
                ],
                {
                  color: "#ea6f2d",
                  weight: 3,
                  opacity: 0.9,
                  dashArray: "6 6",
                }
              )
            );

            map.fitBounds(
              L.latLngBounds([
                [STAY_POINT.lat, STAY_POINT.lon],
                [slat, slon],
              ]),
              { padding: [32, 32] }
            );
          }
        } else if (allBounds.length > 1) {
          map.fitBounds(L.latLngBounds(allBounds), { padding: [32, 32] });
        } else {
          map.setView([STAY_POINT.lat, STAY_POINT.lon], 12);
        }
      }

      function renderPlaceDetails(place) {
        if (!place) {
          placeDetailsEl.innerHTML = `<p class="loading">Select a place to view details.</p>`;
          return;
        }

        const distanceKm = haversineKm(
          STAY_POINT.lat,
          STAY_POINT.lon,
          Number(place.lat),
          Number(place.lon)
        );

        const planRefs = getPlanRefsForPlace(place.index);
        const placeVisitedMap = loadStorageMap(PLACE_VISITED_STORAGE_KEY);
        const isVisited = Boolean(placeVisitedMap[placeVisitedKey(place.index)]);

        placeDetailsEl.innerHTML = `
          <h3>${place.name}</h3>
          <p class="sub">${categoryForPlace(place)}${place.status ? " · " + place.status : ""}</p>

          <div class="detail-grid">
            <div>
              <div class="label">Distance From Home</div>
              <div class="value">${toFixedOrDash(distanceKm, 1)} km</div>
            </div>
            <div>
              <div class="label">Rating</div>
              <div class="value">${place.rating || "-"}</div>
            </div>
            <div>
              <div class="label">Reviews</div>
              <div class="value">${place.review_count || "-"}</div>
            </div>
            <div>
              <div class="label">Plans Referencing Place</div>
              <div class="value">${planRefs.length}</div>
            </div>
          </div>

          <div class="stop-actions">
            <label class="visit-toggle">
              <input type="checkbox" id="placeVisitedToggle" ${isVisited ? "checked" : ""} />
              Mark place visited
            </label>
            <a class="maps-link" href="${placeGoogleMapsUrl(
              place
            )}" target="_blank" rel="noopener noreferrer">Open in Google Maps</a>
          </div>

          <p class="sub">Coordinates: ${toFixedOrDash(place.lat, 5)}, ${toFixedOrDash(place.lon, 5)}</p>

          <h3 style="margin-top: 0.9rem; font-size: 0.9rem;">Appears In Day Plans</h3>
          <div class="ref-plans" id="placeRefPlans">
            ${
              planRefs.length
                ? planRefs
                    .map(
                      (plan) =>
                        `<button class="jump-plan" type="button" data-plan-id="${plan.planId}">${plan.planId.toUpperCase()} · ${
                          plan.title
                        }</button>`
                    )
                    .join("")
                : '<span class="chip warn">Not currently used in a day plan</span>'
            }
          </div>
        `;

        const placeToggle = document.getElementById("placeVisitedToggle");
        if (placeToggle) {
          placeToggle.addEventListener("change", (event) => {
            const next = loadStorageMap(PLACE_VISITED_STORAGE_KEY);
            next[placeVisitedKey(place.index)] = event.currentTarget.checked;
            saveStorageMap(PLACE_VISITED_STORAGE_KEY, next);
            renderPlacesView();
          });
        }

        placeDetailsEl.querySelectorAll("[data-plan-id]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-plan-id");
            const idx = plans.findIndex((plan) => plan.planId === id);
            if (idx >= 0) {
              selectedTripIndex = idx;
              setMode("trips");
            }
          });
        });
      }

      function renderPlacesSummary(filteredPlaces) {
        const visiblePlaces = Array.isArray(filteredPlaces) ? filteredPlaces : getFilteredPlaces();
        const placeVisitedMap = loadStorageMap(PLACE_VISITED_STORAGE_KEY);
        const visitedPlaces = visiblePlaces.filter((p) => placeVisitedMap[placeVisitedKey(p.index)])
          .length;
        const avgRating = (() => {
          const vals = visiblePlaces.map((p) => asNumber(p.rating)).filter((n) => n != null);
          if (!vals.length) return "-";
          return (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2);
        })();

        const filterLabel =
          activeCategoryFilter === "all" ? "all categories" : `category: ${activeCategoryFilter}`;
        placesSummaryTextEl.textContent = `${visiblePlaces.length} / ${places.length} places shown (${filterLabel}). ${visitedPlaces} marked visited in current view. Average place rating: ${avgRating}.`;
      }

      function renderPlacesView() {
        renderCategoryFilters();

        const filteredPlaces = getFilteredPlaces();
        const place =
          filteredPlaces.find((p) => Number(p.index) === Number(selectedPlaceIndex)) ||
          filteredPlaces[0] ||
          null;
        if (place) selectedPlaceIndex = Number(place.index);

        renderPlacesList(filteredPlaces);
        renderPlacesLegend(filteredPlaces);
        renderPlacesMap(place, filteredPlaces);
        renderPlaceDetails(place);
        renderPlacesSummary(filteredPlaces);
      }

      function setMode(mode) {
        activeMode = mode;
        const isTrips = mode === "trips";

        modeTripsBtnEl.classList.toggle("active", isTrips);
        modePlacesBtnEl.classList.toggle("active", !isTrips);

        timelineEl.classList.toggle("hidden", !isTrips);
        placeDetailsEl.classList.toggle("hidden", isTrips);
        tripSummaryBlockEl.classList.toggle("hidden", !isTrips);
        placesSummaryBlockEl.classList.toggle("hidden", isTrips);
        placesToolsEl.classList.toggle("hidden", isTrips);

        if (isTrips) {
          sidebarTitleEl.textContent = "Day Trips";
          sidebarHintEl.textContent = "Choose a route to render on the map.";
          subtitleTextEl.textContent = "Click a day trip to jump to its route and schedule.";
          summaryTitleEl.textContent = "Plan Metrics";
          mapLegendEl.classList.add("hidden");
          renderTripList();
          renderTripView();
        } else {
          sidebarTitleEl.textContent = "Places";
          sidebarHintEl.textContent = "Grouped by category. Click a place for individual view.";
          subtitleTextEl.textContent =
            "Browse all places by category and inspect each place relative to home.";
          summaryTitleEl.textContent = "Places Overview";
          scheduleTitleEl.textContent = "Selected Place";
          renderPlacesView();
        }
      }

      function normalizePlans(input) {
        return Array.isArray(input) ? input : [];
      }

      function normalizePlaces(input) {
        if (Array.isArray(input)) return input;
        if (input && Array.isArray(input.items)) return input.items;
        return [];
      }

      function showLoadingError(message) {
        listPanelEl.innerHTML = `<div class="loading">${message}</div>`;
        metaCountEl.textContent = "No data loaded";
      }

      async function bootstrap() {
        try {
          const [plansResponse, placesResponse] = await Promise.all([
            fetch("./day_trip_plans.json", { cache: "no-store" }),
            fetch("./gandia_places_extracted.json", { cache: "no-store" }),
          ]);

          if (!plansResponse.ok) throw new Error("Could not read day_trip_plans.json");
          if (!placesResponse.ok) throw new Error("Could not read gandia_places_extracted.json");

          plans = normalizePlans(await plansResponse.json());
          places = normalizePlaces(await placesResponse.json());

          if (!plans.length) throw new Error("No day plan data found.");
          if (!places.length) throw new Error("No place data found.");
        } catch (error) {
          showLoadingError(
            "Could not load JSON data. Serve this folder with a local web server, then reload."
          );
          console.error(error);
          return;
        }

        selectedTripIndex = 0;
        selectedPlaceIndex = Number(places[0].index);
        buildCategoryColors();

        modeTripsBtnEl.addEventListener("click", () => setMode("trips"));
        modePlacesBtnEl.addEventListener("click", () => setMode("places"));
        locateMeBtnEl.addEventListener("click", locateMe);

        setMode("trips");
      }

      bootstrap();
    </script>
  </body>
</html>
